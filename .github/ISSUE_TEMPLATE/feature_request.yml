name: Feature request
description: An idea or a missing integration
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Leftoff to do?
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you've tried or considered instead
